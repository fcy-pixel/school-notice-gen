<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學校通告生成器 · 基慈小學</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#0f766e;--green-d:#0d6460;--green-l:#ccfbf1;
  --blue:#1a56db;--blue-l:#e8f0fe;
  --bg:#f0f6f4;--border:#d1e8e2;
  --text:#111827;--muted:#4b7a72;
  --bubble-bot:#fff;--bubble-user:#0f766e;
  --sidebar-w:230px;
}
html,body{height:100%;font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--text)}
#root{display:flex;height:100dvh;overflow:hidden}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:linear-gradient(160deg,#073b4c,#0f766e);
  color:#e0f2ef;padding:18px 14px;
  display:flex;flex-direction:column;gap:16px;overflow-y:auto;
}
.sb-logo{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.15)}
.sb-logo img{width:40px;height:40px;object-fit:contain;background:rgba(255,255,255,.15);border-radius:8px;padding:3px}
.sb-logo h1{font-size:.95rem;line-height:1.3;font-weight:700}
.sb-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;opacity:.7;margin-bottom:4px}
.sb-input{
  width:100%;font:inherit;font-size:.88rem;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:7px;padding:7px 10px;color:#fff;
}
.sb-input option{background:#073b4c}
.sb-hint{font-size:.72rem;opacity:.55;margin-top:3px}
.reset-btn{
  font:inherit;font-size:.85rem;cursor:pointer;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);
  border-radius:99px;color:#fff;padding:7px 12px;text-align:left;
  transition:background .15s;
}
.reset-btn:hover{background:rgba(255,255,255,.2)}

.sb-footer{margin-top:auto;font-size:.7rem;opacity:.4;line-height:1.7}

/* ── Chat main ── */
.chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── Messages ── */
.msgs{flex:1;overflow-y:auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:10px}
.msg-row{display:flex;align-items:flex-end;gap:7px;max-width:700px}
.msg-row.bot{align-self:flex-start}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{font-size:1.2rem;flex-shrink:0;line-height:1;padding-bottom:1px}
.bubble{
  padding:10px 14px;border-radius:16px;
  line-height:1.6;font-size:.93rem;word-break:break-word;
  white-space:pre-wrap;box-shadow:0 2px 6px rgba(0,0,0,.07);
  max-width:560px;
}
.bubble.bot{background:var(--bubble-bot);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text)}
.bubble.user{background:var(--bubble-user);color:#fff;border-bottom-right-radius:4px}
.bubble.typing{padding:14px 18px}
.dots{display:inline-flex;gap:5px}
.dots span{width:7px;height:7px;background:#8ab4ad;border-radius:50%;animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* ── Notice preview ── */
.notice-card{
  background:#fff;border:2px solid var(--green);border-radius:14px;
  padding:18px;margin:6px 0;
  box-shadow:0 4px 14px rgba(15,118,110,.12);
  animation:slide-up .3s ease-out;
}
@keyframes slide-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.nc-header{font-weight:700;color:var(--green);margin-bottom:14px;font-size:.9rem}
.nc-fields{display:flex;flex-direction:column;gap:10px}
.nc-fields label{display:flex;flex-direction:column;gap:4px}
.nc-fields label span{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.nc-fields input,.nc-fields textarea{
  font:inherit;font-size:.88rem;border:1px solid var(--border);border-radius:7px;
  padding:8px 10px;background:var(--bg);color:var(--text);resize:vertical;
}
.nc-fields textarea{min-height:110px}
.nc-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nc-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.nc-hint{font-size:.78rem;color:#c05000;margin-top:6px}
.status-msg{font-size:.82rem;color:var(--muted)}

/* ── Chips ── */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:5px 14px 3px}
.chip{
  font:inherit;font-size:.85rem;cursor:pointer;
  background:#fff;border:1.5px solid var(--green);color:var(--green);
  border-radius:99px;padding:5px 13px;white-space:nowrap;
  transition:background .13s,color .13s;
}
.chip:hover{background:var(--green);color:#fff}

/* ── Input bar ── */
.input-bar{display:flex;align-items:flex-end;gap:8px;padding:8px 14px 12px;background:#fff;border-top:1px solid var(--border)}
.chat-in{
  flex:1;font:inherit;font-size:.92rem;
  border:1.5px solid var(--border);border-radius:14px;
  padding:9px 12px;resize:none;line-height:1.5;
  color:var(--text);background:var(--bg);max-height:130px;overflow-y:auto;
  transition:border-color .13s;
}
.chat-in:focus{outline:none;border-color:var(--green)}
.send-btn{
  width:40px;height:40px;flex-shrink:0;
  background:linear-gradient(135deg,var(--green),#073b4c);
  color:#fff;border:0;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1.05rem;
  transition:transform .13s,filter .13s;
}
.send-btn:hover:not(:disabled){transform:scale(1.08);filter:brightness(1.1)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Buttons ── */
.btn{
  font:inherit;border:0;border-radius:7px;padding:9px 18px;cursor:pointer;
  font-size:.88rem;font-weight:600;transition:background .13s,transform .1s;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:active{transform:scale(.97)}
.btn-dl{background:var(--green);color:#fff;font-size:.92rem;padding:10px 22px}
.btn-dl:hover{background:var(--green-d)}
.btn-dl:disabled{background:#6ee7b7;cursor:not-allowed}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted)}
.btn-ghost:hover{background:var(--bg)}

/* ── Attachment area ── */
.attach-area{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 2px}
.attach-area:empty{display:none}
.file-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:99px;font-size:.78rem;border:1px solid;
}
.file-chip .fc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.file-chip .fc-rm{
  background:none;border:none;cursor:pointer;padding:0 0 0 2px;
  font-size:.8rem;line-height:1;opacity:.6;
}
.file-chip .fc-rm:hover{opacity:1}
.file-chip.fc-text{background:#e0f2ef;border-color:#0f766e;color:#0f766e}
.file-chip.fc-img{background:#fdf4ff;border-color:#9333ea;color:#7e22ce}
.file-chip.fc-loading{background:#f0f9ff;border-color:#0ea5e9;color:#0284c7}
.file-chip.fc-error{background:#fef2f2;border-color:#dc2626;color:#b91c1c}
.attach-btn{
  width:36px;height:36px;align-self:flex-end;flex-shrink:0;margin-bottom:2px;
  background:none;border:1.5px solid var(--border);border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:var(--muted);transition:border-color .13s,color .13s;
}
.attach-btn:hover{border-color:var(--green);color:var(--green)}
.attach-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Toast ── */
#toast{
  position:fixed;bottom:20px;right:20px;
  background:#1f2937;color:#fff;padding:10px 18px;
  border-radius:8px;font-size:.88rem;opacity:0;pointer-events:none;
  transition:opacity .3s;max-width:300px;z-index:999;
}
#toast.show{opacity:1}
#toast.ok{background:var(--green)}
#toast.err{background:#dc2626}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#chatMode{display:flex;flex-direction:column;flex:1;overflow:hidden}

/* ── Auth overlay ── */
#authOverlay{
  position:fixed;inset:0;z-index:10000;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(900px 500px at -10% -10%,#e6f7f5 0%,transparent 60%),
    radial-gradient(800px 500px at 110% -10%,#f0fff4 0%,transparent 60%),
    #f0f6f4;
}
#authOverlay.hidden{display:none}
.auth-card{
  background:#fff;border-radius:20px;
  box-shadow:0 20px 50px -20px rgba(15,23,42,.22);
  padding:36px 32px;max-width:400px;width:100%;text-align:center;
}
.auth-logo{
  width:64px;height:64px;margin:0 auto 14px;border-radius:18px;
  background:linear-gradient(135deg,#0f766e,#073b4c);
  display:grid;place-items:center;
  box-shadow:0 10px 24px -8px rgba(15,118,110,.45);
}
.auth-logo img{width:44px;height:44px;object-fit:contain;filter:brightness(0) invert(1)}
.auth-title{font-size:1.25rem;font-weight:800;color:#0f172a;margin-bottom:6px}
.auth-sub{color:#475569;font-size:.92rem;margin-bottom:4px}
.auth-note{color:#94a3b8;font-size:.8rem;margin-bottom:22px}
.auth-note b{color:#0f766e}
#gisBtn{display:flex;justify-content:center;min-height:44px}
.auth-error{
  margin-top:16px;background:#fff7ed;border:1px solid #fed7aa;
  color:#9a3412;padding:12px;border-radius:10px;font-size:.82rem;
  white-space:pre-line;text-align:left;
}
.auth-footer{color:#94a3b8;font-size:.72rem;margin-top:20px;line-height:1.7}
/* sidebar user badge */
.sb-user{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;
}
.sb-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;referrerpolicy:no-referrer}
.sb-avatar-ph{
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.3);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:.85rem;flex-shrink:0;
}
.sb-user-info{flex:1;min-width:0}
.sb-user-name{font-weight:600;color:#e0f2ef;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-email{color:rgba(255,255,255,.5);font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-signout{
  font:inherit;font-size:.65rem;cursor:pointer;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:5px;color:rgba(255,255,255,.65);padding:3px 7px;
}
.sb-signout:hover{background:rgba(255,255,255,.2);color:#fff}

/* ── Responsive ── */
@media(max-width:640px){
  :root{--sidebar-w:180px}
  .sb-logo h1{font-size:.82rem}
  .bubble{max-width:calc(100vw - 130px)}
}
@media(max-width:420px){
  #root{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;padding:10px 12px;gap:8px;max-height:120px}
  .sb-footer{display:none}
}
</style>
</head>
<body>
<div id="root">

<!-- ── Sidebar ───────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sb-logo">
    <img src="logo.png" alt="校徽">
    <h1>學校通告<br>生成器</h1>
  </div>

  <button class="reset-btn" onclick="resetChat()">🔄 重新開始</button>

  <div id="sbUser" style="display:none"></div>

  <div class="sb-footer">中華基督教會基慈小學<br>學校行政工具</div>
</aside>

<!-- ── Chat mode ──────────────────────────────────────────────── -->
<div id="chatMode">
  <div class="msgs" id="msgs"></div>

  <div class="chips" id="chips"></div>

  <div class="attach-area" id="attachArea"></div>

  <form class="input-bar" id="chatForm" onsubmit="sendMsg(event)">
    <input type="file" id="fileInput" multiple
      accept=".pdf,.txt,.png,.jpg,.jpeg,.gif,.webp"
      style="display:none" onchange="onFileSelected(this)">
    <button type="button" class="attach-btn" id="attachBtn"
      title="附加檔案（PDF、圖片、TXT）"
      onclick="document.getElementById('fileInput').click()">&#128206;</button>
    <textarea class="chat-in" id="chatIn" rows="1"
      placeholder="輸入訊息⋯⋯（Enter 發送，Shift+Enter 換行）"
      onkeydown="handleKey(event)"></textarea>
    <button type="submit" class="send-btn" id="sendBtn" disabled>➤</button>
  </form>
</div>

</div>
<div id="toast"></div>

<!-- ── Google Auth overlay ─────────────────────────────────────── -->
<div id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="logo.png" alt="校徽">
    </div>
    <div class="auth-title">中華基督教會基慈小學</div>
    <div class="auth-sub">學校通告生成器</div>
    <div class="auth-note">
      請使用 <b>@keitsz.edu.hk</b> 帳號登入
    </div>
    <div id="gisBtn"></div>
    <div id="authError" class="auth-error" style="display:none"></div>
    <div class="auth-footer">
      登入後 30 天內不需重新驗證<br>
      系統只讀取你的姓名與電郵，不會寫入 Google 帳號
    </div>
  </div>
</div>

<script>
// ── Google Auth ────────────────────────────────────────────────
const GOOGLE_CLIENT_ID = '623198168089-oht8mb2d4pi444g4imks1ncn1sdgkg44.apps.googleusercontent.com';
const ALLOWED_DOMAIN = 'keitsz.edu.hk';
const AUTH_KEY = 'ksz_notice_auth_v1';
const SESSION_MS = 30 * 24 * 60 * 60 * 1000; // 30 days

function parseJwt(token) {
  try {
    const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(base64).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  } catch { return null; }
}

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideAuthOverlay(info) {
  document.getElementById('authOverlay').classList.add('hidden');
  // Show user badge in sidebar
  const sbUser = document.getElementById('sbUser');
  const avatarHtml = info.picture
    ? `<img class="sb-avatar" src="${info.picture}" referrerpolicy="no-referrer" alt="">`
    : `<div class="sb-avatar-ph">${info.name.charAt(0)}</div>`;
  sbUser.innerHTML = `
    ${avatarHtml}
    <div class="sb-user-info">
      <div class="sb-user-name">${escAuth(info.name)}</div>
      <div class="sb-user-email">${escAuth(info.email)}</div>
    </div>
    <button class="sb-signout" onclick="authSignOut()">登出</button>`;
  sbUser.style.display = 'flex';
}

function escAuth(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function authSignOut() {
  localStorage.removeItem(AUTH_KEY);
  try { window.google?.accounts?.id?.disableAutoSelect(); } catch {}
  document.getElementById('sbUser').style.display = 'none';
  document.getElementById('authOverlay').classList.remove('hidden');
  document.getElementById('authError').style.display = 'none';
  initGIS();
}

function handleCredential(resp) {
  const payload = parseJwt(resp.credential);
  if (!payload) { showAuthError('登入回應無效，請再試一次'); return; }
  const hd = payload.hd || (payload.email||'').split('@')[1];
  if (hd !== ALLOWED_DOMAIN) {
    showAuthError(`此系統只開放給 @${ALLOWED_DOMAIN} 帳號使用。\n你登入的是：${payload.email||'(未知)'}`);
    return;
  }
  if (payload.email_verified === false) { showAuthError('Google 帳號電郵尚未驗證，無法登入'); return; }
  const info = { email: payload.email, name: payload.name||payload.email, picture: payload.picture||'', hd, exp: Date.now() + SESSION_MS };
  localStorage.setItem(AUTH_KEY, JSON.stringify(info));
  hideAuthOverlay(info);
}

function initGIS() {
  if (!window.google?.accounts?.id) return;
  window.google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredential,
    hd: ALLOWED_DOMAIN,
    auto_select: true,
    cancel_on_tap_outside: false,
    ux_mode: 'popup',
  });
  const btn = document.getElementById('gisBtn');
  if (btn) {
    btn.innerHTML = '';
    window.google.accounts.id.renderButton(btn, { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill', width: 280 });
  }
  try { window.google.accounts.id.prompt(); } catch {}
}

function authInit() {
  // Check stored session
  try {
    const raw = localStorage.getItem(AUTH_KEY);
    if (raw) {
      const info = JSON.parse(raw);
      if (info.exp > Date.now() && info.hd === ALLOWED_DOMAIN) {
        hideAuthOverlay(info);
        return;
      }
      localStorage.removeItem(AUTH_KEY);
    }
  } catch {}
  // Load GIS script and show login
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true; s.defer = true;
  s.onload = () => initGIS();
  document.body.appendChild(s);
}

authInit();
</script>

<script>
// ── State ──────────────────────────────────────────────────────
const state = {
  messages: [],
  attachments: [], // [{name, category:'text'|'image', content, status:'loading'|'ready'|'error'}]
  notice: null,
  loading: false,
};

const WELCOME = '你好！👋 我係**通告小幫手**，幫你快速生成各類學校通告。\n\n你今次想出邊種通告呢？';
const NOTICE_TYPES = ['活動通告','家長通告','考試測驗通知','繳費通知','緊急通告','其他通告'];

// ── Init ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  addBotMsg(WELCOME);
  setChips(NOTICE_TYPES);
  document.getElementById('chatIn').addEventListener('input', onInputChange);
});

function onInputChange() {
  const v = document.getElementById('chatIn').value.trim();
  const hasReady = state.attachments.some(a => a.status === 'ready');
  document.getElementById('sendBtn').disabled = (!v && !hasReady) || state.loading;
}

// ── Chat ───────────────────────────────────────────────────────
function sendMsg(e) {
  if (e) e.preventDefault();
  const inp = document.getElementById('chatIn');
  const text = inp.value.trim();
  const hasReady = state.attachments.some(a => a.status === 'ready');
  if ((!text && !hasReady) || state.loading) return;
  inp.value = '';
  onInputChange();
  doSend(text);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

async function doSend(text) {
  const readyAtts = state.attachments.filter(a => a.status === 'ready');
  const textAtts  = readyAtts.filter(a => a.category === 'text');
  const imageAtts = readyAtts.filter(a => a.category === 'image');

  // Build API message text (includes extracted PDF/TXT content)
  let apiText = text;
  for (const att of textAtts) {
    const preview = att.content.length > 4000
      ? att.content.slice(0, 4000) + '\n…（內容已截短）'
      : att.content;
    apiText += '\n\n【附件「' + att.name + '」】\n' + '─'.repeat(16) + '\n' + preview + '\n' + '─'.repeat(16);
  }
  if (imageAtts.length) apiText += '\n\n[已附上圖片：' + imageAtts.map(a => a.name).join(', ') + ']';

  // Show in chat (text + image thumbnails)
  addUserMsgRich(text, imageAtts);
  setChips([]);
  state.messages.push({ role: 'user', content: apiText });
  state.notice = null;

  const sentImages = imageAtts.map(a => a.content); // base64 data URLs
  state.attachments = [];
  renderAttachments();

  document.querySelectorAll('.notice-card').forEach(el => el.remove());

  const typingId = addTyping();
  state.loading = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('attachBtn').disabled = true;

  try {
    const body = {
      messages: state.messages,
      school_name: '中華基督教會基慈小學',
    };
    if (sentImages.length) body.images = sentImages;

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '發生錯誤');

    removeTyping(typingId);
    addBotMsg(data.reply);
    state.messages.push({ role: 'assistant', content: data.reply });

    if (data.status === 'generated' && data.notice) {
      state.notice = data.notice;
      renderNoticeCard(data.notice);
    }
    setChips(data.suggestedReplies || []);
  } catch (err) {
    removeTyping(typingId);
    addBotMsg('❌ 出錯了：' + err.message);
  } finally {
    state.loading = false;
    onInputChange();
    document.getElementById('attachBtn').disabled = false;
    document.getElementById('chatIn').focus();

        body: JSON.stringify(payload),
      });
      filename = (payload['標題'] || '學校通告') + '.docx';

    } else {

        title:      document.getElementById('nc-title').value,

      ['活動地點', 'nc-actplace'],

      ['集合地點', 'nc-meetplace'],

      ['領隊老師', 'nc-teacher'],
      ['備註', 'nc-remarks'],
      ['回條截止日期', 'nc-deadline'],
    ];
    text = fields
      .map(([label, id]) => {
        const v = document.getElementById(id)?.value?.trim();
        return v ? `${label}：${v}` : '';
      })
      .filter(Boolean)
      .join('\n');
  } else if (noticeType === 'general') {
    const title   = document.getElementById('nc-title')?.value || '';
    const rec     = document.getElementById('nc-rec')?.value || '';
    const body    = document.getElementById('nc-body')?.value || '';
    const items   = document.getElementById('nc-reply-items')?.value || '';
    text = [title, rec + '，', '', body, items ? '\n--- 回條 ---\n' + items : ''].join('\n').trim();
  } else {
    const title   = document.getElementById('nc-title')?.value || '';
    const rec     = document.getElementById('nc-rec')?.value || '';
    const body    = document.getElementById('nc-body')?.value || '';
    const closing = document.getElementById('nc-close')?.value || '';
    text = [title, rec + '，', '', body, '', closing].join('\n');

  navigator.clipboard.writeText(text).then(() => toast('已複製到剪貼板', 'ok'));
}

// ── Attachments ──────────────────────────────────────────
const MAX_FILE_MB = 10;
async function onFileSelected(inp) {
  const files = Array.from(inp.files);
  inp.value = '';
  for (const file of files) {
    const idx = state.attachments.length;
    state.attachments.push({ name: file.name, category: null, content: null, status: 'loading' });
    renderAttachments();
    try {
      const result = await processFile(file);
      state.attachments[idx] = { ...result, status: 'ready' };
    } catch (err) {
      state.attachments[idx] = { name: file.name, category: 'error', content: '', status: 'error', errMsg: err.message };
      toast('❌ ' + file.name + '：' + err.message, 'err');
    }
    renderAttachments();
  }
}
async function processFile(file) {
  if (file.size > MAX_FILE_MB * 1024 * 1024) throw new Error('檔案不可超過 ' + MAX_FILE_MB + ' MB');
  const ext = file.name.split('.').pop().toLowerCase();
  const imgExts = ['png','jpg','jpeg','gif','webp'];
  if (ext === 'pdf') {
    const text = await extractPdfText(file);
    if (!text.trim()) throw new Error('無法從 PDF 提取文字');
    return { name: file.name, category: 'text', content: text };
  }
  if (ext === 'txt') {
    const text = await file.text();
    return { name: file.name, category: 'text', content: text };
  }
  if (imgExts.includes(ext)) {
    const dataUrl = await fileToDataUrl(file);
    return { name: file.name, category: 'image', content: dataUrl };
  }
  throw new Error('不支援的檔案類型（支援：PDF、TXT、圖片）');
}
async function extractPdfText(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js 未載入');
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const c = await page.getTextContent();
    text += c.items.map(x => x.str).join(' ') + '\n';
  }
  return text.trim();
}
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('檔案讀取失敗'));
    r.readAsDataURL(file);
  });
}
function renderAttachments() {
  const area = document.getElementById('attachArea');
  area.innerHTML = '';
  state.attachments.forEach((a, i) => {
    const icon = a.status === 'loading' ? '⏳' : a.status === 'error' ? '⚠️' : a.category === 'image' ? '🖼️' : '📄';
    const cls  = a.status === 'loading' ? 'fc-loading' : a.status === 'error' ? 'fc-error' : a.category === 'image' ? 'fc-img' : 'fc-text';
    const chip = document.createElement('div');
    chip.className = 'file-chip ' + cls;
    chip.title = a.status === 'error' ? (a.errMsg || '錯誤') : a.name;
    chip.innerHTML = icon + ' <span class="fc-name">' + esc(a.name) + '</span>' +
      (a.status !== 'loading' ? '<button class="fc-rm" onclick="removeAttachment(' + i + ')">✕</button>' : '');
    area.appendChild(chip);
  });
  onInputChange();
}
function removeAttachment(i) {
  state.attachments.splice(i, 1);
  renderAttachments();
}
// ── Helpers ────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function md(s) {
  return esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
}
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(t._t); t._t = setTimeout(()=>t.className='', 3000);
}

const FORM_SCRIPT = `
const form2 = document.getElementById('form2');
function getFields2(){const d={};form2.querySelectorAll('input,textarea').forEach(el=>{if(el.name)d[el.name]=el.value.trim()});return d;}
function setFields2(obj){for(const[k,v]of Object.entries(obj)){const el=form2.querySelector('[name="'+k+'"]');if(el&&v)el.value=v;}}
function normDate2(inp){const raw=inp.value.trim();if(!raw)return;inp.value=raw.replace(/(\\d{1,4})[\\/.-](\\d{1,2})[\\/.-](\\d{2,4})/g,(_,a,b,c)=>{let d,mo,y;if(c.length===4){d=parseInt(a);mo=parseInt(b);y=parseInt(c);}else{d=parseInt(a);mo=parseInt(b);y=parseInt(c);if(y<100)y+=2000;}return isNaN(d)||isNaN(mo)||isNaN(y)?_:d+'-'+mo+'-'+y;});}
async function aiEnhance2(){const btn=document.getElementById('btnAI2');btn.disabled=true;btn.innerHTML='<span class="spin"></span> AI 處理中…';try{const fields=getFields2();if(!fields['活動名稱']){toast('請先填寫活動名稱','err');return;}const res=await fetch('/api/ai-enhance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)});const json=await res.json();if(!res.ok)throw new Error(json.error||'AI 錯誤');setFields2(json);toast('✓ AI 優化完成，請檢查各欄位','ok');}catch(e){toast('❌ '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='<span>🤖</span> AI 優化語句';}}
async function generate2(){const fields=getFields2();if(!fields['活動名稱']||!fields['學年']){toast('請至少填寫「學年」及「活動名稱」','err');return;}const btn=document.getElementById('btnDL2');btn.disabled=true;btn.innerHTML='<span class="spin"></span> 生成中…';try{const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)});if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.error||'伺服器錯誤');}const blob=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(fields['活動名稱']||'學校通告')+'.docx';a.click();toast('✓ 通告已下載','ok');}catch(e){toast('❌ '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='<span>📄</span> 下載通告 .docx';}}
function onPdfFileChange2(inp){const f=inp.files[0];document.getElementById('pdfName2').textContent=f?f.name:'';document.getElementById('btnPDF2').disabled=!f;}
function handleDrop2(e){e.preventDefault();document.getElementById('uploadZone2').classList.remove('drag');const f=e.dataTransfer.files[0];if(!f||!f.name.toLowerCase().endsWith('.pdf')){toast('請上傳 PDF 檔案','err');return;}const dt=new DataTransfer();dt.items.add(f);const inp=document.getElementById('pdfInput2');inp.files=dt.files;onPdfFileChange2(inp);}
async function extractFromPDF2(){const file=document.getElementById('pdfInput2').files[0];if(!file)return toast('請先選擇 PDF','err');const btn=document.getElementById('btnPDF2');btn.disabled=true;btn.innerHTML='<span class="spin"></span> 讀取 PDF…';try{if(typeof pdfjsLib==='undefined')throw new Error('PDF.js 未載入');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const ab=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:ab}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const c=await page.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n';}let payload;if(text.trim().length>50){payload={text};}else{btn.innerHTML='<span class="spin"></span> 渲染頁面…';const imgs=[];const n=Math.min(pdf.numPages,3);for(let i=1;i<=n;i++){const page=await pdf.getPage(i);const vp=page.getViewport({scale:1.8});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;imgs.push(cv.toDataURL('image/png').split(',')[1]);}payload={images:imgs};}btn.innerHTML='<span class="spin"></span> AI 分析中…';const res=await fetch('/api/extract-pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const json=await res.json();if(!res.ok)throw new Error(json.error||'提取失敗');setFields2(json);toast('✓ 已提取 '+Object.keys(json).length+' 個欄位','ok');}catch(e){toast('❌ '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='<span>🤖</span> AI 提取欄位';}}
`;
